{
"name": "Build APK",
"on": ["push", "workflow_dispatch"],
"permissions": {"contents": "write"},
"jobs": {
"build": {
"runs-on": "ubuntu-latest",
"steps": [
{"uses": "actions/checkout@v4"},
{"name": "Unzip project", "run": "unzip -q Ishara_Android_Project.zip"},
{"name": "Find project folder", "id": "find", "run": "DIR=$(dirname $(find . -mindepth 2 -name settings.gradle -not -path './.git/*' | head -n1)); echo dir=$DIR >> $GITHUB_OUTPUT"},
{"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}},
{"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.9"}},
{"name": "Build debug APK", "working-directory": "${{ steps.find.outputs.dir }}", "run": "gradle assembleDebug --no-daemon"},
{"name": "Rename APK", "run": "cp ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk Ishara.apk"},
{"uses": "softprops/action-gh-release@v2", "with": {"tag_name": "latest", "name": "إشارة - أحدث نسخة", "files": "Ishara.apk", "make_latest": "true"}}
]
}
}
}
