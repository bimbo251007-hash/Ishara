name: Build APK and Web

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.find.outputs.dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q Ishara_Android_Project.zip

      - name: Find project folder
        id: find
        run: |
          DIR=$(dirname "$(find . -mindepth 2 -name settings.gradle -not -path './.git/*' | head -n1)")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          CLEAN=$(printf '%s' "$KEYSTORE_B64" | tr -d ' \n\r\t')
          echo "Secret length: ${#CLEAN} (expected 3488)"
          if [ -n "$CLEAN" ]; then
            printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/ishara.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/ishara.keystore" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret - using default debug signing"
          fi

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp "${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" Ishara.apk

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: إشارة - أحدث نسخة
          files: Ishara.apk
          make_latest: "true"

      - name: Collect web files
        run: |
          mkdir site
          cp -r "${{ steps.find.outputs.dir }}/app/src/main/assets/." site/
          cp Ishara.apk site/Ishara.apk
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-web:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  build-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        shell: pwsh
        run: Expand-Archive -Path Ishara_Android_Project.zip -DestinationPath . -Force

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare desktop app
        shell: bash
        run: |
          DIR="${{ needs.build.outputs.dir }}"
          mkdir -p desktop-build/app
          cp -r "$DIR/app/src/main/assets/." desktop-build/app/
          cp "$DIR/desktop/package.json" "$DIR/desktop/main.js" desktop-build/
          cp "$DIR/app/src/main/res/drawable/ishara_icon.png" desktop-build/icon.png

      - name: Build Windows installer
        shell: bash
        working-directory: desktop-build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win --publish never

      - name: Publish Windows files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: |
            desktop-build/dist/Ishara-Setup.exe
            desktop-build/dist/Ishara-Portable.exe
